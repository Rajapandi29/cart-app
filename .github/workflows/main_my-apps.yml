
name: Build and deploy Node.js to Azure Function App - my-apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Function App files
        run: |
          test -f backend/package.json || {
            echo "ERROR: backend/package.json missing"
            exit 1
          }
          test -f backend/host.json || {
            echo "ERROR: backend/host.json missing"
            exit 1
          }

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build application
        working-directory: backend
        run: npm run build --if-present

      - name: Run tests
        working-directory: backend
        run: npm run test --if-present

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: backend/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_192055920B83481D9DA33D3DD9419DE4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CA22387785B4411B7C1DFFC47457412 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4F2FBC68A1064152AD238BFE8F158763 }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: my-apps
          slot-name: Production
          package: deploy
